<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
</head>
<body>
    <h1>{{ settings[1] if settings else 'Welcome' }}</h1>
    <p>{{ settings[2] if settings else '' }}</p>
    {% if settings and settings[0] %}
        <img src="{{ url_for('static', filename='uploads/' + settings[0].split('/')[-1]) }}" alt="Logo" width="200">
    {% endif %}
    <br>
    <a href="{{ url_for('login') }}">Admin Login</a>
</body>
</html>
